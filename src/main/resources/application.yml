spring:
  application:
    name: login-seguro

  config:
    import: optional:file:.env[.properties]

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:login_seguro}
      auto-index-creation: true

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

app:
  theme:
    default-theme: ${APP_DEFAULT_THEME:padrao}
    available:
      - padrao
      - escuro

  security:
    max-failed-attempts: 5
    lock-duration: 15m

  session:
    cookie-secure: ${COOKIE_SECURE:false}

  bootstrap-admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    org.springframework.security: INFO
