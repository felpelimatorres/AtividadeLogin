<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro · Universidade Vale Sereno</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/brasao.svg}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/themes/padrao/theme.css}">
</head>
<body class="theme-padrao">
<main class="container page">
    <div class="card center">
        <img class="brand-logo error-logo" th:src="@{/img/brasao.svg}" alt="">
        <p class="status-code" th:text="${status}">500</p>
        <h1 th:text="${status == 404} ? 'Página não encontrada' : 'Algo deu errado'">Algo deu errado</h1>
        <p>Não foi possível concluir sua solicitação no Portal Acadêmico.</p>
        <a class="btn" th:href="@{/}">Voltar ao início</a>
    </div>
</main>
</body>
</html>
