<!DOCTYPE html>
<!--/*
  Tema "escuro": layout com menu lateral e paleta escura.
  Mostra que um tema pode mudar a ESTRUTURA da página, não só as cores,
  sem nenhuma alteração em controllers ou serviços.
*/-->
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title layout:title-pattern="$CONTENT_TITLE · Login Seguro">Login Seguro</title>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
</head>
<body class="theme-escuro layout-sidebar">
<div class="shell">
    <aside class="sidebar">
        <a th:replace="~{fragments/common :: brand}"></a>
        <nav aria-label="Navegação principal">
            <ul th:replace="~{fragments/common :: nav-links}"></ul>
        </nav>
    </aside>

    <div class="shell-main">
        <main class="page">
            <th:block th:replace="~{fragments/common :: alerts}"></th:block>
            <section layout:fragment="content">Conteúdo da página</section>
        </main>
        <footer th:replace="~{fragments/common :: footer}"></footer>
    </div>
</div>
</body>
</html>
